name: Publish lava-cli to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g tree-sitter-cli@^0.25.0
      - run: tree-sitter generate
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p lava-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
