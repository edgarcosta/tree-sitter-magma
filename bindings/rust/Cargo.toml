[package]
name = "tree-sitter-magma"
description = "magma grammar for the tree-sitter parsing library"
version = "0.1.0"
keywords = ["incremental", "parsing", "magma"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/edgarcosta/tree-sitter-magma"
edition = "2021"
license = "MIT"

build = "build.rs"
include = [
  "Cargo.toml",
  "build.rs",
  "lib.rs",
  "../../grammar.js",
  "../../queries/*",
  "../../src/*",
]

[lib]
path = "lib.rs"

[dependencies]
tree-sitter-language = "0.1.0"

[build-dependencies]
cc = "1.0"
